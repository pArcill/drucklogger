<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Pressure Dashboard</title>
  <meta name="description" content="Live preview of atmospheric pressure sensors for the IoT Pressure Logger." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <script>
    window.__PRESSURE_API_BASE__ = '/api';
    window.__PRESSURE_USE_MOCK__ = false;
  </script>
</head>
<body>
  <noscript>
    <div class="noscript">JavaScript is required to render the dashboard preview.</div>
  </noscript>
  <div class="page">
    <div class="toolbar" aria-label="Dashboard controls">
      <div class="toolbar__status" id="connectionStatus" role="status">Bootstrapping mock data stream</div>
      <div class="toolbar__actions">
        <button class="chip chip--primary" data-action="refresh" type="button">Manual refresh</button>
        <span class="chip chip--ghost" id="lastUpdated">Last sync pending</span>
      </div>
    </div>

    <main class="layout">
      <section class="panel stats" aria-label="Global pressure statistics">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Overview</p>
            <h2>Pressure field status</h2>
          </div>
          <span id="statTotal" class="badge">0 measurements</span>
        </div>
        <div class="stats__grid">
          <article class="stat-card">
            <p class="stat-card__label">Latest reading</p>
            <p class="stat-card__value" id="statLatest">--</p>
            <p class="stat-card__meta" id="statLatestSensor">Awaiting feed</p>
          </article>
          <article class="stat-card">
            <p class="stat-card__label">Average</p>
            <p class="stat-card__value" id="statAverage">--</p>
            <p class="stat-card__meta">Rolling window</p>
          </article>
          <article class="stat-card">
            <p class="stat-card__label">Range</p>
            <p class="stat-card__value" id="statRange">--</p>
            <p class="stat-card__meta">Min · Max</p>
          </article>
          <article class="stat-card">
            <p class="stat-card__label">Connected sensors</p>
            <p class="stat-card__value" id="statSensors">0</p>
            <p class="stat-card__meta" id="statOffline">0 offline</p>
          </article>
        </div>
      </section>

      <section class="panel map" aria-label="Sensor locations">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Geospatial</p>
            <h2>Field map</h2>
          </div>
          <button class="chip chip--ghost" data-action="toggle-live" type="button">Pause live updates</button>
        </div>
        <div id="sensorMap" class="map__canvas" role="img" aria-label="Sensor markers on a map of central Europe"></div>
      </section>

      <section class="panel sensors" aria-label="Sensor fleet detail">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Assets</p>
            <h2>Sensor fleet</h2>
          </div>
          <select id="sensorFilter" class="chip chip--ghost" aria-label="Filter sensors by status">
            <option value="all">All sensors</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </div>
        <div id="sensorGrid" class="sensor-grid" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
